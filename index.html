<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Villani - Calendario Ore</title>

  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon/icon-192.png" />
  <link rel="apple-touch-icon" href="./icon/icon-192.png" />
  <link rel="stylesheet" href="./style.css?v=52" />
</head>
<body>
  <header class="app-header">
    <div class="header-side"></div>
    <div class="header-center">
      <div class="brand-badge">
        <span class="brand-dot"></span>
        <h1>Villani</h1>
      </div>
      <div class="subtitle">Impianti &middot; Calendario ore</div>
    </div>
    <div class="header-side header-right">
      <button id="todayBtn" class="today-btn hidden" type="button" title="Torna a oggi">Oggi</button>
    </div>
  </header>

  <main>
    <div class="calendar-shell">
      <div class="cal-top-card">
        <div class="cal-top">
          <button id="prevMonth" class="cal-nav" type="button" aria-label="Mese precedente">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div class="cal-month-wrap">
            <div id="monthLabel" class="cal-month"></div>
            <div class="cal-hint">Tocca un giorno per inserire 8h &middot; Tieni premuto per azzerare</div>
          </div>
          <button id="nextMonth" class="cal-nav" type="button" aria-label="Mese successivo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>

        <div class="stats-bar">
          <div class="stat-pill primary">
            <span class="stat-label">Totale Ore</span>
            <span id="monthTotal" class="stat-value">0h</span>
          </div>
          <div class="stat-pill">
            <span class="stat-label">Giorni</span>
            <span id="monthDays" class="stat-value">0</span>
          </div>
          <div class="stat-pill ferie">
            <span class="stat-label">Ferie</span>
            <span id="monthFerie" class="stat-value">0</span>
          </div>
          <div class="stat-pill permesso">
            <span class="stat-label">Permessi</span>
            <span id="monthPermessi" class="stat-value">0</span>
          </div>
        </div>
      </div>

      <div class="cal-weekdays">
        <div>LUN</div><div>MAR</div><div>MER</div><div>GIO</div><div>VEN</div><div class="wknd">SAB</div><div class="wknd">DOM</div>
      </div>

      <div id="calendarGrid" class="cal-grid"></div>
    </div>
  </main>

  <div id="hoursModalOverlay" class="modal hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="hoursModalTitle">
      <div class="modal-header">
        <h3 id="hoursModalTitle">Ore</h3>
        <button id="hoursDelete" class="btn-icon-danger" type="button" title="Azzera giorno" aria-label="Azzera giorno">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
        </button>
      </div>

      <!-- Selettore tipo -->
      <div id="entryTypeGroup" class="type-group">
        <label class="type-chip" for="typeHours">
          <input type="radio" id="typeHours" name="entryType" value="hours" checked />
          <span class="dot hours"></span><span>Ore</span>
        </label>
        <label class="type-chip" for="typeFerie">
          <input type="radio" id="typeFerie" name="entryType" value="ferie" />
          <span class="dot ferie"></span><span>Ferie</span>
        </label>
        <label class="type-chip" for="typePermesso">
          <input type="radio" id="typePermesso" name="entryType" value="permesso" />
          <span class="dot permesso"></span><span>Permesso</span>
        </label>
      </div>

      <div id="hoursControlsWrap" class="hours-controls-wrap">
        <div class="deriv-spinner">
          <button id="hoursDown" class="deriv-arrow" type="button" aria-label="Diminuisci ore">−</button>
          <div class="deriv-value-wrap">
            <div id="hoursValue" class="deriv-value">8</div>
            <span class="deriv-unit">ore</span>
          </div>
          <button id="hoursUp" class="deriv-arrow" type="button" aria-label="Aumenta ore">+</button>
        </div>

        <div id="quickPresets" class="quick-presets">
          <button type="button" class="preset-btn" data-hours="4">4h</button>
          <button type="button" class="preset-btn" data-hours="6">6h</button>
          <button type="button" class="preset-btn" data-hours="8">8h</button>
          <button type="button" class="preset-btn" data-hours="9">9h</button>
          <button type="button" class="preset-btn" data-hours="10">10h</button>
        </div>
      </div>

      <div class="modal-actions">
        <button id="hoursCancel" class="btn secondary" type="button">Annulla</button>
        <button id="hoursOk" class="btn primary" type="button">Salva</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./app.js?v=52"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('SW registrato'))
          .catch((err) => console.error('Errore SW:', err));
      });
    }
  </script>
</body>
</html>
